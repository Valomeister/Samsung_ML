<!DOCTYPE html>
<html>
<head>
    <title>Geo Predictor</title>
    <style>
        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            padding: 40px;
            font-family: Inter, Arial, sans-serif;
            background: #f5f7fb;
            color: #1f2937;
            line-height: 1.6;
        }

        h2 {
            margin-top: 0;
            margin-bottom: 24px;
            font-size: 28px;
            font-weight: 700;
        }

        form {
            max-width: 700px;
            padding: 32px;
            background: white;
            border-radius: 16px;
            box-shadow: 0 8px 24px rgba(0,0,0,0.08);
        }

        p {
            margin-bottom: 16px;
        }

        label {
            display: block;
            margin-bottom: 8px;
            font-weight: 600;
        }

        input[type="file"],
        input[type="number"],
        input[type="text"] {
            width: 100%;
            padding: 12px 14px;
            border: 1px solid #d1d5db;
            border-radius: 10px;
            font-size: 15px;
            background: white;
        }

        input[type="file"] {
            padding: 10px;
        }

        input:focus {
            outline: none;
            border-color: #2563eb;
            box-shadow: 0 0 0 3px rgba(37,99,235,0.15);
        }

        button {
            border: none;
            border-radius: 10px;
            padding: 12px 24px;
            background: #2563eb;
            color: white;
            font-size: 15px;
            font-weight: 600;
            cursor: pointer;
            transition: 0.2s;
        }

        button:hover {
            background: #1d4ed8;
        }

        a {
            display: inline-block;
            margin-top: 20px;
            text-decoration: none;
            color: #2563eb;
            font-weight: 600;
        }

        a:hover {
            text-decoration: underline;
        }

        b {
            color: #111827;
        }

        body > p {
            max-width: 700px;
            padding: 14px 18px;
            background: white;
            border-radius: 10px;
            box-shadow: 0 2px 8px rgba(0,0,0,0.05);
        }

        div {
            margin-top: 30px;
        }
    </style>
</head>
<body>
    <h2>Загрузи фото и укажи реальные координаты</h2>
    <form method="post" enctype="multipart/form-data">
        {% csrf_token %}
        {{ form.as_p }}
        <button type="submit">Предсказать</button>
    </form>
</body>
</html>
